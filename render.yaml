# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Provisions:
#   - pathiq-api : the FastAPI service (Docker)
#   - pathiq-db  : a Postgres instance for users, cases, and the audit log.
#                  DATABASE_URL is wired into the API automatically via fromDatabase.
#
# After first deploy, set PATHIQ_CORS_ORIGINS in the dashboard to your frontend
# origin (e.g. https://your-app.vercel.app). Optionally set PATHIQ_ALLOW_SIGNUP
# to "false" to disable public sign-up. See docs/DEPLOYMENT.md.

databases:
  - name: pathiq-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: pathiq-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PATHIQ_CORS_ORIGINS
        sync: false
      - key: PATHIQ_ALLOW_SIGNUP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pathiq-db
          property: connectionString
