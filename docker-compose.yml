# Local smoke test for the production-style API image.
# Frontend: run `cd frontend && npm run dev` with VITE_API_URL=http://127.0.0.1:8000
#
#   docker compose up --build

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PATHIQ_CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      PATHIQ_DB_PATH: /app/data/pathiq_workflow.db
    volumes:
      - pathiq-data:/app/data
      # Uncomment after running bootstrap locally to enable /analyze in the container:
      # - ./backend/model/artifacts:/app/backend/model/artifacts:ro

volumes:
  pathiq-data:
